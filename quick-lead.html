<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CareMore Leads</title>
<!-- Home-screen app (iPhone + Android). Add to Home Screen opens it full-screen like an app. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CM Leads">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2d5a3d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ee;--surface:#fff;--border:#e0dbd0;--text:#1a1916;--text2:#6b6760;--text3:#9e9b94;--accent:#2d5a3d;--accent-light:#e8f0ea;--danger:#c0392b;--amber:#b7860b;--amber-light:#fdf6e3}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',-apple-system,system-ui,sans-serif;font-size:16px}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 28px);max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin:0 0 6px}
.field{margin-bottom:14px}.field:last-child{margin-bottom:0}
input,textarea,select{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--text);-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
textarea{min-height:120px;resize:vertical;line-height:1.45}
.hint{font-size:12.5px;color:var(--text3);margin-top:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;padding:9px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{display:block;width:100%;font:inherit;font-size:18px;font-weight:700;padding:16px;border-radius:14px;border:none;background:var(--accent);color:#fff}
.btn:disabled{opacity:.6}
.btn.secondary{background:#fff;color:var(--accent);border:1px solid var(--accent);font-size:16px;font-weight:600;padding:13px}
.err{color:var(--danger);font-size:13px;margin-top:6px;display:none}
.has-error input{border-color:var(--danger)}.has-error .err{display:block}
.done{text-align:center;padding:28px 16px}
.done .tick{font-size:52px;line-height:1;color:var(--accent)}
.done h2{font-size:21px;margin:10px 0 6px}
.done p{color:var(--text2);font-size:14.5px;margin-bottom:18px}
.recent h3{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.recent li{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:14.5px}
.recent li:first-child{border-top:none}
.badge{font-size:12px;font-weight:600;border-radius:10px;padding:2px 8px;white-space:nowrap;align-self:center}
.badge.ok{background:var(--accent-light);color:var(--accent)}.badge.wait{background:var(--amber-light);color:var(--amber)}
.more summary{font-size:14px;font-weight:600;color:var(--accent);cursor:pointer;padding:4px 0;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more[open] summary{margin-bottom:12px}
.mic-wrap{text-align:center;padding:8px 0 4px}
.mic{width:132px;height:132px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:54px;line-height:1;box-shadow:0 6px 18px rgba(45,90,61,.28);display:inline-flex;align-items:center;justify-content:center}
.mic.live{background:var(--danger);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,57,43,.45)}70%{box-shadow:0 0 0 22px rgba(192,57,43,0)}100%{box-shadow:0 0 0 0 rgba(192,57,43,0)}}
.mic-label{font-size:16px;font-weight:600;margin-top:12px}
.mic-sub{font-size:13px;color:var(--text3);margin-top:4px;line-height:1.4}
.banner{display:none;background:var(--amber-light);color:var(--amber);border:1px solid #f0d080;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
</style>
</head>
<body>


<section id="app" style="display:none">
  <header><h1>New lead</h1></header>
  <div class="banner" id="queue-banner"></div>

  <form id="lead-form" onsubmit="event.preventDefault();sendLead();" autocomplete="off">
    <div class="card">
      <div class="mic-wrap">
        <button type="button" class="mic" id="mic" onclick="toggleMic()" aria-label="Tap and talk">🎤</button>
        <div class="mic-label" id="mic-label">Tap and talk</div>
        <div class="mic-sub" id="mic-sub">Say everything about the call — name, number, where, when, size, how they found us.</div>
      </div>
      <div class="field" id="f-notes" style="margin-top:14px"><textarea id="notes" placeholder="What you say shows up here. You can also type, or use the 🎤 on your keyboard."></textarea><div class="err">Say or type something first</div></div>
    </div>

    <details class="card more" id="more">
      <summary>+ Add details by hand (optional)</summary>
      <div class="row field">
        <div><label for="name">Name</label><input id="name" autocapitalize="words"></div>
        <div><label for="phone">Phone</label><input id="phone" type="tel" inputmode="tel" placeholder="(415) 555-0123"></div>
      </div>
      <div class="field"><label for="date">Move date</label><input id="date" type="date"></div>
      <div class="field"><label>Home size</label><div class="chips" data-group="size">
        <button type="button" class="chip">Studio</button><button type="button" class="chip">1 bedroom</button><button type="button" class="chip">2 bedroom</button><button type="button" class="chip">3 bedroom</button><button type="button" class="chip">4+ bedroom</button><button type="button" class="chip">Office/commercial</button><button type="button" class="chip">Storage unit</button>
      </div></div>
      <div class="field"><label>Job type</label><div class="chips" data-group="moveType">
        <button type="button" class="chip">Move</button><button type="button" class="chip">Pack and move</button><button type="button" class="chip">Pack, move and unpack</button><button type="button" class="chip">Move to storage</button><button type="button" class="chip">Move out of storage</button><button type="button" class="chip">Packing only</button>
      </div></div>
      <div class="row field">
        <div><label for="from">Moving from</label><input id="from" placeholder="City or address" autocapitalize="words"></div>
        <div><label for="to">Moving to</label><input id="to" placeholder="City or address" autocapitalize="words"></div>
      </div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" inputmode="email" autocapitalize="off"></div>
      <div class="field"><label>How did they find us?</label><div class="chips" data-group="source">
        <button type="button" class="chip">Yelp</button><button type="button" class="chip">Google</button><button type="button" class="chip">ChatGPT</button><button type="button" class="chip">Referral</button><button type="button" class="chip">Repeat customer</button><button type="button" class="chip">Realtor</button><button type="button" class="chip">Building</button><button type="button" class="chip">Other</button>
      </div></div>
    </details>

    <button class="btn" id="send-btn" type="submit">Save lead</button>
  </form>

  <div class="card recent" id="recent" style="margin-top:12px;display:none"><h3>Sent from this phone</h3><ul id="recent-list"></ul></div>
</section>

<section id="done" style="display:none">
  <div class="card done">
    <div class="tick">✓</div>
    <h2 id="done-title">Lead saved</h2>
    <p id="done-text">It's waiting in MoveDesk under “Import now”.</p>
    <button class="btn" onclick="newLead()">Next lead</button>
  </div>
</section>

<script>
// ── CareMore quick lead (2026-11-09) ─────────────────────────────────────────────────────────
// A phone-sized way to log a call in ~10 seconds. Saves into the same pending_leads inbox the
// website quote form uses, so MoveDesk shows "Import now" and the lead lands under Leads.
// No signal? The lead is kept on the phone and sent automatically the next time it can be.
var SUPABASE_URL='https://oohqrvjhncssasjqkrzl.supabase.co';
var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vaHFydmpobmNzc2FzanFrcnpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4MDY2MzIsImV4cCI6MjA5MDM4MjYzMn0.x9N_sTjBRmSrxD-LVatV9hcpPLCuWtQh6-lIMMYfxLI';
var K_QUEUE='cm-quick-queue',K_RECENT='cm-quick-recent';

function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v));}catch(_){return null;}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

// Chips: tap to pick one, tap again to clear
document.querySelectorAll('.chips').forEach(function(g){
  g.addEventListener('click',function(e){
    var b=e.target.closest('.chip');if(!b)return;
    var on=b.classList.contains('on');
    g.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on');});
    if(!on)b.classList.add('on');
  });
});
$('notes').addEventListener('input',function(){$('f-notes').classList.remove('has-error');});
function chip(group){var b=document.querySelector('.chips[data-group="'+group+'"] .chip.on');return b?b.textContent:'';}

function show(id){['app','done'].forEach(function(s){$(s).style.display=(s===id)?'block':'none';});window.scrollTo(0,0);}
function start(){show('app');renderRecent();flushQueue();}

function collect(){
  var notes=$('notes').value.trim();
  var src=chip('source');
  return {
    name:$('name').value.trim(),
    phone:$('phone').value.trim(),
    email:$('email').value.trim(),
    date:$('date').value||'',
    size:chip('size'),
    moveType:chip('moveType'),
    from:$('from').value.trim(),
    to:$('to').value.trim(),
    source:src,
    notes:notes,
    quickLead:true,
    submittedAt:new Date().toISOString()
  };
}
// Nothing is required — just don't send a completely empty lead.
function validate(d){
  var any=!!(d.notes||d.name||d.phone||d.email||d.from||d.to||d.date||d.size||d.moveType||d.source);
  $('f-notes').classList.toggle('has-error',!any);
  return any;
}

function post(row){
  return fetch(SUPABASE_URL+'/rest/v1/pending_leads',{method:'POST',
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify([row])}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return true;});
}
function addRecent(d,status,id){
  var w=(d.notes||'').split(/\s+/).filter(Boolean);var label=d.name||(w.slice(0,6).join(' ')+(w.length>6?'…':''));
  var r=ls(K_RECENT)||[];r.unshift({id:id,name:label||'Lead',phone:d.phone,at:d.submittedAt,status:status});
  ls(K_RECENT,r.slice(0,10));renderRecent();
}
function markRecent(id,status){var r=ls(K_RECENT)||[];r.forEach(function(x){if(x.id===id)x.status=status;});ls(K_RECENT,r);renderRecent();}
function renderRecent(){
  var r=ls(K_RECENT)||[];var box=$('recent');if(!r.length){box.style.display='none';return;}
  box.style.display='block';
  $('recent-list').innerHTML=r.map(function(x){
    var t=new Date(x.at);var when=t.toLocaleDateString([], {weekday:'short'})+' '+t.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
    return '<li><span><strong>'+esc(x.name)+'</strong><br><span style="color:var(--text3);font-size:13px">'+(x.phone?esc(x.phone)+' · ':'')+when+'</span></span>'
      +(x.status==='sent'?'<span class="badge ok">In MoveDesk</span>':'<span class="badge wait">Waiting for signal</span>')+'</li>';
  }).join('');
  var q=ls(K_QUEUE)||[];var b=$('queue-banner');
  if(q.length){b.style.display='block';b.textContent='📶 '+q.length+' lead'+(q.length>1?'s':'')+' saved on this phone — will send automatically when you have signal.';}
  else b.style.display='none';
}

function sendLead(){
  stopMic();var d=collect();if(!validate(d))return;
  var btn=$('send-btn');btn.disabled=true;btn.textContent='Saving…';
  var id=uid();var row={id:id,data:d};
  post(row).then(function(){
    addRecent(d,'sent',id);
    $('done-title').textContent='Lead saved'+(d.name?' — '+d.name:'');
    $('done-text').textContent='It’s in MoveDesk now. Open MoveDesk and tap “Import now” at the top.';
  }).catch(function(){
    var q=ls(K_QUEUE)||[];q.push(row);ls(K_QUEUE,q);
    addRecent(d,'queued',id);
    $('done-title').textContent='Saved on this phone';
    $('done-text').textContent='No connection right now — it will send by itself next time you open this with signal.';
  }).finally(function(){btn.disabled=false;btn.textContent='Save lead';show('done');});
}
function newLead(){$('lead-form').reset();document.querySelectorAll('.chip.on').forEach(function(c){c.classList.remove('on');});
  $('more').open=false;document.querySelectorAll('.has-error').forEach(function(f){f.classList.remove('has-error');});show('app');}

// ── Tap and talk ─────────────────────────────────────────────────────────────────────────────
// Uses the phone's own speech-to-text (Chrome on Android, Safari on iPhone). Words appear in the box
// as you speak; tap again to stop. Where the phone doesn't offer it here, tapping the mic opens the
// box with the keyboard so the keyboard's own 🎤 can be used instead.
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null,live=false,base='';
function setMicUI(on){$('mic').classList.toggle('live',on);$('mic').textContent=on?'■':'🎤';
  $('mic-label').textContent=on?'Listening… tap to stop':'Tap and talk';}
function keyboardFallback(){
  $('mic-label').textContent='Use the 🎤 on your keyboard';
  $('mic-sub').textContent='This phone won\u2019t let the app listen directly here — tap the microphone on the keyboard and talk.';
  $('notes').focus();
}
function toggleMic(){if(live){stopMic();return;}startMic();}
function startMic(){
  if(!SR){keyboardFallback();return;}
  try{
    rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;
    var t=$('notes').value.trim();base=t?t+' ':'';
    rec.onresult=function(e){
      var finalTxt='',interim='';
      for(var i=e.resultIndex;i<e.results.length;i++){var r=e.results[i];if(r.isFinal)finalTxt+=r[0].transcript;else interim+=r[0].transcript;}
      if(finalTxt){base=base+finalTxt.trim()+' ';}
      $('notes').value=(base+interim).replace(/^\s+/,'');$('f-notes').classList.remove('has-error');
    };
    rec.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed'){live=false;setMicUI(false);keyboardFallback();}};
    // Phones stop listening after a pause — carry on until the mic is tapped again.
    rec.onend=function(){if(live){try{rec.start();}catch(_){live=false;setMicUI(false);}}};
    rec.start();live=true;setMicUI(true);
  }catch(_){live=false;setMicUI(false);keyboardFallback();}
}
function stopMic(){if(!live)return;live=false;setMicUI(false);try{rec&&rec.stop();}catch(_){}}

// Send anything saved while offline
var _flushing=false;
function flushQueue(){
  var q=ls(K_QUEUE)||[];if(!q.length||_flushing)return;_flushing=true;
  var left=[];
  q.reduce(function(p,row){return p.then(function(){return post(row).then(function(){markRecent(row.id,'sent');}).catch(function(){left.push(row);});});},Promise.resolve())
   .then(function(){ls(K_QUEUE,left);_flushing=false;renderRecent();});
}
window.addEventListener('online',flushQueue);
document.addEventListener('visibilitychange',function(){if(!document.hidden)flushQueue();});

// Home-screen icon + Android install manifest, built here so this stays a single file.
(function(){
  try{
    var c=document.createElement('canvas');c.width=c.height=192;var x=c.getContext('2d');
    x.fillStyle='#2d5a3d';x.fillRect(0,0,192,192);
    x.fillStyle='#fff';x.font='bold 84px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('CM',96,90);
    x.font='600 30px sans-serif';x.fillText('LEADS',96,150);
    var icon=c.toDataURL('image/png');
    var l=document.createElement('link');l.rel='apple-touch-icon';l.href=icon;document.head.appendChild(l);
    var f=document.createElement('link');f.rel='icon';f.href=icon;document.head.appendChild(f);
    var m={name:'CareMore Leads',short_name:'CM Leads',start_url:location.href,display:'standalone',background_color:'#f5f3ee',theme_color:'#2d5a3d',icons:[{src:icon,sizes:'192x192',type:'image/png'}]};
    var ml=document.createElement('link');ml.rel='manifest';ml.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(m));document.head.appendChild(ml);
  }catch(_){}
})();

start();
</script>
</body>
</html>
